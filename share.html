<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Générer un lien d'invitation · Naila &amp; Youssef</title>
  <link rel="icon" type="image/png" href="./assets/img/tild3263-3561-4339-a533-643564366236-ic_baseline-place_1.png">
  <style>
    :root{
      --bg:#f9e6d4;
      --card:#fffaf3;
      --accent:#ac9778;
      --accent-dark:#866739;
      --btn:#747b54;
      --btn-hover:#616b47;
      --text:#2a2a2a;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:var(--bg);
      color:var(--text);
      font-family:'Ovo',Georgia,'Times New Roman',serif;
    }
    .card{
      width:100%;
      max-width:480px;
      background:var(--card);
      border:1px solid var(--accent);
      border-radius:14px;
      padding:36px 28px;
      box-shadow:0 12px 40px rgba(134,103,57,.12);
    }
    h1{
      margin:0 0 6px;
      text-align:center;
      font-size:28px;
      font-weight:500;
      color:var(--accent-dark);
    }
    .subtitle{
      margin:0 0 28px;
      text-align:center;
      font-size:15px;
      color:var(--accent);
    }
    label{
      display:block;
      margin-bottom:8px;
      font-size:16px;
      color:var(--text);
    }
    input[type="text"]{
      width:100%;
      height:48px;
      padding:0 14px;
      font-size:18px;
      font-family:inherit;
      color:var(--text);
      background:transparent;
      border:1px solid var(--accent);
      border-radius:8px;
      outline:none;
    }
    input[type="text"]:focus{border-color:var(--accent-dark);}
    button{
      font-family:inherit;
      cursor:pointer;
      border:none;
      border-radius:8px;
      transition:background-color .15s ease-in-out,opacity .15s;
    }
    .btn-primary{
      width:100%;
      height:48px;
      margin-top:18px;
      font-size:16px;
      letter-spacing:.5px;
      color:#fff;
      background:var(--btn);
    }
    .btn-primary:hover{background:var(--btn-hover);}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
    .result{
      margin-top:26px;
      display:none;
    }
    .result.show{display:block;}
    .result-link{
      display:flex;
      gap:8px;
      margin-top:8px;
    }
    .result-link input{
      flex:1 1 auto;
      min-width:0;
      height:44px;
      padding:0 12px;
      font-size:14px;
      font-family:inherit;
      color:var(--accent-dark);
      background:#fff;
      border:1px solid var(--accent);
      border-radius:8px;
    }
    .btn-copy{
      flex:0 0 auto;
      height:44px;
      padding:0 16px;
      font-size:14px;
      color:#fff;
      background:var(--accent);
    }
    .btn-copy:hover{background:var(--accent-dark);}
    .btn-wa{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      width:100%;
      height:46px;
      margin-top:10px;
      font-size:15px;
      color:#fff;
      background:#25d366;
      text-decoration:none;
      border-radius:8px;
    }
    .btn-wa:hover{background:#1fb457;}
    .hint{
      margin-top:10px;
      font-size:13px;
      color:var(--accent);
      min-height:16px;
    }
    .error{color:#c0392b;}
  </style>
</head>
<body>
  <div class="card">
    <h1>Lien d'invitation</h1>
    <p class="subtitle">Naila &amp; Youssef · 21 Août 2026</p>

    <label for="guest">Nom de l'invité</label>
    <input type="text" id="guest" placeholder="Ex : Youssef, Naila AMARA, La famille AMARA, etc." autocomplete="off">

    <button type="button" class="btn-primary" id="generate">Générer le lien</button>

    <div class="result" id="result">
      <label for="link" id="link-label">Lien à envoyer</label>
      <div class="result-link">
        <input type="text" id="link" readonly>
        <button type="button" class="btn-copy" id="copy">Copier</button>
      </div>
      <a class="btn-wa" id="whatsapp" href="#" target="_blank" rel="noopener">Envoyer via WhatsApp</a>
      <div class="hint" id="hint"></div>
    </div>
  </div>

  <script>
    (function(){
      var guest=document.getElementById('guest');
      var generate=document.getElementById('generate');
      var result=document.getElementById('result');
      var linkInput=document.getElementById('link');
      var copyBtn=document.getElementById('copy');
      var whatsapp=document.getElementById('whatsapp');
      var hint=document.getElementById('hint');
      var linkLabel=document.getElementById('link-label');

      function buildLink(name){
        var base=location.origin&&location.origin!=='null'?location.origin:location.href.replace(/\/[^\/]*$/,'');
        return base+'/?name='+encodeURIComponent(name);
      }

      function doGenerate(){
        var name=guest.value.trim();
        hint.className='hint';
        if(!name){
          hint.className='hint error';
          hint.textContent='Veuillez saisir un nom.';
          result.className='result';
          return;
        }
        var url=buildLink(name);
        linkInput.value=url;
        var nameEsc=name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        linkLabel.innerHTML='Lien de l\'invitation de <strong>'+nameEsc+'</strong> à envoyer';
        var msg='Bonjour '+name+', vous êtes invité(e) au mariage de Naila & Youssef. Voici votre invitation : '+url;
        whatsapp.href='https://wa.me/?text='+encodeURIComponent(msg);
        result.className='result show';
        guest.value='';
        hint.textContent='';
      }

      generate.addEventListener('click',doGenerate);
      guest.addEventListener('keydown',function(e){if(e.key==='Enter')doGenerate();});

      copyBtn.addEventListener('click',function(){
        linkInput.select();
        linkInput.setSelectionRange(0,99999);
        var done=function(){hint.className='hint';hint.textContent='Lien copié !';};
        if(navigator.clipboard&&navigator.clipboard.writeText){
          navigator.clipboard.writeText(linkInput.value).then(done).catch(function(){try{document.execCommand('copy');done();}catch(e){}});
        }else{
          try{document.execCommand('copy');done();}catch(e){}
        }
      });
    })();
  </script>
</body>
</html>
